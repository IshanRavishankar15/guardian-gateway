name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and audit dashboard dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=moderate
      - name: Run backend integration and multi-process tests
        run: docker compose --profile test run --build --rm test-runner
      - name: Build the dashboard
        run: docker compose run --build --rm --no-deps frontend npm run build
      - name: Validate Compose configuration
        run: docker compose config --quiet
